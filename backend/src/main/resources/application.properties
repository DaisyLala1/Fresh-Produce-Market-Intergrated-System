# ---------------------------------------------------------------------------
# Fresh Produce Market POS and Consignment Management System
# Default profile: MySQL. For a quick demo without MySQL run with the "h2" profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ---------------------------------------------------------------------------
spring.application.name=fresh-produce-pos
server.port=${PORT:8080}

# MySQL (database is created automatically if it does not exist)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fresh_produce_pos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Sessions
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# AI forecasting service (Python + FastAPI)
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.api-key=${AI_API_KEY:fresh-produce-shared-key}
app.ai.timeout-ms=10000

# Load demonstration data on first start (only when the database is empty)
app.seed.enabled=${SEED_DATA:true}

logging.level.org.hibernate.SQL=WARN
